spring.application.name=user-service-test
spring.datasource.url=jdbc:h2:mem:smarttask_users;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.datasource.hikari.maximum-pool-size=5

# JWT (>= 32 bytes)
jwt.secret=unit-test-jwt-secret-must-be-at-least-32-bytes-long-ok
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
jwt.refresh-token-cookie-name=refreshToken
jwt.cookie-path=/
jwt.cookie-secure=false

management.endpoints.web.exposure.include=health
